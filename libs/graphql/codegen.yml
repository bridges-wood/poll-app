overwrite: true
schema: 'generated/schema.gql'
generates:
  libs/graphql/src/lib/generated/react.tsx:
    plugins:
      - 'typescript-operations'
      - 'typescript-react-apollo'
    config:
      withHooks: true
      withComponent: false
      withHOC: false
  libs/graphql/src/lib/generated/types.ts:
    plugins:
      - 'typescript'
  
