apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: default
  labels:
    app: auth-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
      annotations:
        consul.hashicorp.com/connect-inject: "true"
    spec:
      serviceAccountName: auth-service
      containers:
        - name: auth-service
          image: bridgeswood/auth-service:main
          imagePullPolicy: Always
          ports:
          - containerPort: 5300          
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          env:
          - name: HOST_IP
            valueFrom:
              fieldRef:
                fieldPath: status.hostIP
          - name: PORT
            value: "5300"
          - name: FIREBASE_API_KEY
            valueFrom:
              secretKeyRef:
                name: firebase-credentials
                key: api-key
          - name: FIREBASE_AUTH_DOMAIN
            valueFrom:
              secretKeyRef:
                name: firebase-credentials
                key: auth-domain
          - name: FIREBASE_PROJECT_ID
            valueFrom:
              secretKeyRef:
                name: firebase-credentials
                key: project-id
          - name: FIREBASE_STORAGE_BUCKET
            valueFrom:
              secretKeyRef:
                name: firebase-credentials
                key: storage-bucket
          - name: FIREBASE_MESSAGING_SENDER_ID
            valueFrom:
              secretKeyRef:
                name: firebase-credentials
                key: messaging-sender-id
          - name: FIREBASE_APP_ID
            valueFrom:
              secretKeyRef:
                name: firebase-credentials
                key: app-id
          - name: FIREBASE_CLIENT_EMAIL
            valueFrom:
              secretKeyRef:
                name: firebase-credentials
                key: client-email
          - name: FIREBASE_ADMIN_PRIVATE_KEY
            valueFrom:
              secretKeyRef:
                name: firebase-credentials
                key: private-key
          - name: JWT_SECRET
            valueFrom:
              secretKeyRef:
                name: jwt
                key: jwt-secret
          livenessProbe:
            httpGet:
              path: /health
              port: 5300
            initialDelaySeconds: 15
            timeoutSeconds: 1
            periodSeconds: 10
            failureThreshold: 30


