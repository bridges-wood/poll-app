kind: Build
name: api-gateway-ts
description: Use nx to build the api-gateway
type: exec
buildAtSource: true
spec:
  command: [ls ..]

---

kind: Build
name: api-gateway-container
description: API Gateway service container image
buildAtSource: true
type: container
spec:
  buildArgs:
---

kind: Deploy
name: api-gateway
description: The gateway to the api of the poll-app
type: container

build: api-gateway-container

variables:
  ingressPath: /graphql

spec:
  ports:
    - name: http
      containerPort: 3000
      servicePort: 80
  ingresses:
    - path: ${var.ingressPath}
      port: http

---

kind: Run
name: api-gateway-run-task
type: container
build: api-gateway-container
spec:
  command: ["sh", "-c", "echo task output"]